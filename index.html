<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chubby Red Panda | FiveM Vehicle HUD</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="music-open">
  <main id="cockpit" class="theme-classic" aria-label="Vehicle HUD">
    <div class="hud-sweep"></div>
    <div class="hud-corner corner-tl"></div>
    <div class="hud-corner corner-br"></div>

    <!-- PENGATURAN HUD & MUSIC PLAYER (SISTEM PERSIS CONTOH SAMC) -->
    <div id="settingsMenu">
      <div class="settings-heading">
        <span class="settings-dot"></span>
        <span>MECHA CONFIG</span>
        <button id="closeSettings" class="icon-button" type="button" aria-label="Tutup pengaturan">×</button>
      </div>

      <div class="menu-btns">
        <button type="button" data-act="resize">Resize</button>
        <button type="button" data-act="move">Pindah</button>
        <button type="button" data-act="reset">Reset</button>
        <button type="button" data-act="theme">Theme</button>
      </div>

      <!-- PEMUTAR MUSIK YOUTUBE PERSIS SAMC -->
      <section id="music-panel" class="music-panel no-drag" aria-label="Online Music Player">
        <div class="music-now-playing">
          <div class="music-video-wrap">
            <div id="youtube-player"></div>
            <img id="music-cover" class="music-cover" alt="" aria-hidden="true">
            <div id="music-player-placeholder" class="music-placeholder">
              <span class="music-placeholder-note" aria-label="Music">♪</span>
            </div>
          </div>
          <div class="music-track-meta">
            <div id="music-track-title">Belum ada lagu</div>
            <div id="music-track-subtitle">Online playback</div>
          </div>
        </div>

        <div class="music-progress-row">
          <span id="music-current-time">0:00</span>
          <input id="music-progress" class="music-range" type="range" min="0" max="1000" value="0" step="1" aria-label="Song progress">
          <span id="music-duration">0:00</span>
        </div>

        <div class="music-main-controls">
          <button id="btn-music-prev" class="music-control-btn" type="button" title="Previous">⏮</button>
          <button id="btn-music-play" class="music-play-btn" type="button" title="Play / Pause">▶</button>
          <button id="btn-music-next" class="music-control-btn" type="button" title="Next">⏭</button>
        </div>

        <div class="music-volume-row">
          <button id="btn-music-mute" class="music-icon-btn" type="button" title="Mute">🔊</button>
          <input id="music-volume" class="music-range" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
          <button id="btn-music-add-toggle" class="music-small-btn music-add-toggle" type="button" title="Tambah lagu">＋</button>
        </div>

        <div id="music-add-row" class="music-add-row hide">
          <input id="music-url-input" type="text" placeholder="Link YouTube / ID Video" autocomplete="off">
          <input id="music-title-input" type="text" placeholder="Nama lagu (opsional)" autocomplete="off">
          <button id="btn-music-add" class="music-small-btn music-add-primary" type="button">▶</button>
        </div>

        <div class="music-tools-row">
          <button id="btn-music-repeat" class="music-tool-btn" type="button" title="Ulangi lagu">↻</button>
          <button id="btn-music-shuffle" class="music-tool-btn" type="button" title="Putar acak">⤨</button>
        </div>

        <div class="music-playlist-head">
          <span>Playlist</span>
          <button id="btn-music-clear" class="music-text-btn" type="button" title="Kosongkan playlist">×</button>
        </div>
        <div id="music-playlist" class="music-playlist" role="list">
          <div class="music-empty">Playlist kosong. Tekan + untuk menambah lagu.</div>
        </div>
      </section>

      <div id="settingsHint">Klik kanan untuk menutup menu</div>
      <div class="settings-footer">
        <span>MECHA OS</span>
        <span>BUILD 05.26</span>
      </div>
    </div>

    <section id="redPandaHUD" class="red-panda-hud" aria-label="Chubby Red Panda vehicle HUD">
      <svg id="redPanda" class="panda-art" viewBox="0 0 420 430" role="img" aria-label="Panda merah sebagai speedometer">
        <defs>
          <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffbd69"/><stop offset=".55" stop-color="#d86a32"/><stop offset="1" stop-color="#984126"/></linearGradient>
          <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9ec"/><stop offset="1" stop-color="#e7d9c8"/></linearGradient>
          <radialGradient id="eyeGlow"><stop stop-color="#fff"/><stop offset=".4" stop-color="#9cf7ff"/><stop offset="1" stop-color="#126d80"/></radialGradient>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#54230f" flood-opacity=".32"/></filter>
        </defs>
        <!-- ears are part of the silhouette -->
        <g class="ear ear-left"><path d="M94 123 Q45 94 57 31 Q62 5 89 35 L145 91Z" fill="url(#fur)" stroke="#78391f" stroke-width="5"/><path d="M87 88 Q66 61 75 37 Q98 55 116 91Z" fill="#f5b0a1"/></g>
        <g class="ear ear-right"><path d="M326 123 Q375 94 363 31 Q358 5 331 35 L275 91Z" fill="url(#fur)" stroke="#78391f" stroke-width="5"/><path d="M333 88 Q354 61 345 37 Q322 55 304 91Z" fill="#f5b0a1"/></g>
        <path class="head-fur" d="M112 88 Q142 65 178 76 Q210 58 242 76 Q278 65 308 88 Q344 107 350 151 L365 178 L345 197 L359 220 L335 240 L344 260 L315 278 Q300 327 255 346 Q210 365 165 346 Q120 327 105 278 L76 260 L85 240 L61 220 L75 197 L55 178 L70 151 Q76 107 112 88Z" fill="url(#fur)" stroke="#78391f" stroke-width="6" filter="url(#softShadow)"/>
        <path d="M106 133 Q127 106 158 125 L172 163 Q148 185 113 169Z M314 133 Q293 106 262 125 L248 163 Q272 185 307 169Z" fill="#49302b"/>
        <path d="M82 204 Q109 171 155 190 Q176 207 167 249 Q143 279 101 253 L77 230Z" fill="url(#cream)"/><path d="M338 204 Q311 171 265 190 Q244 207 253 249 Q277 279 319 253 L343 230Z" fill="url(#cream)"/>
        <g class="eyes"><ellipse cx="139" cy="167" rx="42" ry="39" fill="#30221f"/><ellipse cx="281" cy="167" rx="42" ry="39" fill="#30221f"/>
          <text id="speedValue" x="139" y="176" text-anchor="middle" class="speed-number">000</text><text id="speedUnit" x="139" y="193" text-anchor="middle" class="speed-unit">KM/H</text>
          <circle class="rpm-eye" cx="281" cy="167" r="27" fill="none" stroke="#8ffaff" stroke-width="7" stroke-dasharray="130 170" transform="rotate(-90 281 167)"/><circle class="rpm-pupil" cx="281" cy="167" r="13" fill="url(#eyeGlow)"/><circle cx="276" cy="161" r="4" fill="#fff"/>
          <path class="sleep-eye sleep-left" d="M107 167 Q139 187 171 167"/><path class="sleep-eye sleep-right" d="M249 167 Q281 187 313 167"/>
          <path class="spiral" d="M121 166 q-10 -16 5 -18 q16 0 10 15 q-4 9 -12 3 q-5 -5 1 -8 M263 166 q-10 -16 5 -18 q16 0 10 15 q-4 9 -12 3 q-5 -5 1 -8" fill="none" stroke="#fff" stroke-width="4"/>
        </g>
        <g class="sweat"><path d="M67 146 Q54 165 67 174 Q80 165 67 146Z" fill="#8eeaff"/><path d="M353 146 Q340 165 353 174 Q366 165 353 146Z" fill="#8eeaff"/></g>
        <g class="fire"><path d="M315 132 Q301 109 321 91 Q321 111 338 106 Q352 126 338 145Z" fill="#ff3c24"/><path d="M327 132 Q321 119 332 114 Q339 128 327 132Z" fill="#ffd34f"/></g>
        <ellipse cx="210" cy="242" rx="98" ry="81" fill="url(#cream)" stroke="#b88b6b" stroke-width="3"/>
        <ellipse cx="210" cy="218" rx="19" ry="13" fill="#251a19"/><path d="M210 230 Q197 241 184 232 M210 230 Q223 241 236 232" fill="none" stroke="#633a32" stroke-width="4" stroke-linecap="round"/>
        <g class="mouth"><path d="M154 245 Q210 280 266 245 Q258 298 210 302 Q162 298 154 245Z" fill="#592126"/><path d="M164 250 Q210 267 256 250 L247 265 L173 265Z" fill="#fffdf4"/><path d="M185 267 L196 282 L203 269 M217 269 L224 282 L235 267" fill="#fffdf4" stroke="#d8c8b8" stroke-width="2"/><path class="tongue" d="M190 287 Q210 276 230 287 Q224 305 210 305 Q196 305 190 287Z" fill="#f58eaa"/><g class="bamboo"><path d="M174 245 Q211 225 245 238" fill="none" stroke="#5c8c39" stroke-width="7" stroke-linecap="round"/><ellipse cx="190" cy="236" rx="17" ry="7" transform="rotate(-30 190 236)" fill="#7fc95d"/><ellipse cx="224" cy="235" rx="17" ry="7" transform="rotate(24 224 235)" fill="#68b94d"/></g></g>
        <path class="blush" d="M89 226 Q113 211 137 231 M331 226 Q307 211 283 231" fill="none" stroke="#ff9eae" stroke-width="13" stroke-linecap="round" opacity=".85"/>
        <g class="patch"><path d="M91 255 l24 24 M115 255 l-24 24" stroke="#f4d5b4" stroke-width="8"/><path d="M91 255 l24 24 M115 255 l-24 24" stroke="#b87960" stroke-width="2"/></g>
        <g class="sleep-bubble"><circle cx="238" cy="203" r="9" fill="#dff8ff" stroke="#7abbd0" stroke-width="2"/><circle cx="251" cy="190" r="5" fill="#dff8ff" stroke="#7abbd0" stroke-width="2"/></g>
        <path d="M156 338 Q210 365 264 338 Q254 385 210 385 Q166 385 156 338Z" fill="#9e4b2c" stroke="#78391f" stroke-width="4"/>
        <circle cx="210" cy="386" r="23" fill="#f4d9a0" stroke="#8d5b32" stroke-width="4"/><text id="gearValue" x="210" y="391" text-anchor="middle" class="gear-text">N</text><text id="odometerValue" x="210" y="416" text-anchor="middle" class="odo-text">000000.0 KM</text>
        <path class="headlight-beam" d="M202 216 L210 198 L218 216Z" fill="#fff8a8"/>
      </svg>
      <div class="panda-meta"><span id="engineStatus">ENGINE OFF</span><span>RPM <b id="rpmValue">0000</b></span><span>FUEL <b id="fuelValue">100%</b></span><span>HP <b id="healthValue">100%</b></span><span id="aiMessage">RED PANDA READY</span></div>
      <div class="panda-status"><span id="leftIndicator">◀</span><span id="seatbeltIndicator">BELT</span><span id="headlightIndicator">LIGHT</span><span id="rightIndicator">▶</span></div>
    </section>
    <!-- Compatibility targets retained for the original telemetry renderers. -->
    <div class="legacy-targets" aria-hidden="true"><span id="rpmBar"></span><span id="fuelBar"></span><span id="healthBar"></span><span id="headlightLabel">LIGHT</span><span id="engineCheck"></span><span id="fuelCard"></span><span id="healthCard"></span><span id="rightIndicatorLegacy"></span><span id="odometerValueLegacy"></span><span id="gearLegacy"></span><span id="engine"></span><span id="speed"></span><span id="rpm"></span><span id="fuel"></span><span id="health"></span><span id="gear"></span><span id="headlights"></span><span id="indicators"></span><span id="seatbelts"></span><span id="odometer"></span><span id="leftIndicatorLegacy"></span></div>
    <div id="alarmBanner" role="status" aria-live="polite">
      <span class="alarm-symbol">!</span>
      <span>OVERSPEED DETECTED</span>
      <span class="alarm-speed">LIMIT 60</span>
    </div>
  </main>

  <audio id="speedAlarmAudio" src="speedlimit.mp3" preload="auto" loop></audio>
  <script src="script.js"></script>
</body>
</html>
